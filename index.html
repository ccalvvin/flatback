<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Planner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#5f6875;--ac:#e8590c;--bd:#e2e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#1a1d22;--tx:#eceff3;--mu:#98a1ae;--ac:#ff8a4c;--bd:#2a2f37}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
select,input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{border:1px solid var(--bd);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px}
.chips input{display:none}
.chips label:has(input:checked){border-color:var(--ac);color:var(--ac);font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.days button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.days button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.ex{display:flex;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.ex img{width:120px;height:120px;border-radius:8px;background:#fff;flex:none;object-fit:cover}
.ex h3{margin:0 0 2px;font-size:16px;text-transform:capitalize}
.tag{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:12px;padding:0 8px;margin:0 4px 4px 0}
.rx{font-weight:700;color:var(--ac);margin:4px 0}
details summary{cursor:pointer;color:var(--mu);font-size:13px}
details ol{margin:6px 0 0;padding-left:20px}
.acts{display:flex;gap:6px;margin-top:6px;align-items:center}
.acts .btn{padding:3px 10px;font-size:13px}
.done{opacity:.5}
.foot{color:var(--mu);font-size:12px;margin-top:24px}
.foot a{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px}
@media(max-width:520px){.ex img{width:88px;height:88px}}
@media print{.tabs,#gen,.bar,.acts,.days{display:none}.ex{break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1>💪 Gym Planner</h1>
<p class="sub">Build a weekly workout from 1,300+ exercises with animated demos.</p>
<div class="tabs"><button id="t1" class="on">Plan generator</button><button id="t2">Exercise library</button><a class="btn" href="explorer.html" style="text-decoration:none">Exercise Explorer →</a></div>

<section id="v1">
  <div class="panel" id="gen">
    <div class="grid">
      <div><label class="f">Goal</label><select id="goal"><option value="hyp">Build muscle</option><option value="str">Get stronger</option><option value="end">Fat loss / endurance</option></select></div>
      <div><label class="f">Days per week</label><select id="days"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div>
      <div><label class="f">Experience</label><select id="lvl"><option value="0">Beginner</option><option value="1" selected>Intermediate</option><option value="2">Advanced</option></select></div>
    </div>
    <label class="f" style="margin-top:14px">Equipment you have</label>
    <div class="chips" id="eq"></div>
    <div class="bar"><button class="btn pri" id="go">Generate plan</button><button class="btn" id="print">Print / save PDF</button></div>
  </div>
  <div id="plan"><div class="empty">Loading exercises…</div></div>
</section>

<section id="v2" hidden>
  <div class="panel">
    <div class="grid">
      <div><label class="f">Search</label><input type="text" id="q" placeholder="e.g. squat"></div>
      <div><label class="f">Body part</label><select id="fb"></select></div>
      <div><label class="f">Equipment</label><select id="fq"></select></div>
    </div>
  </div>
  <div id="lib"></div>
  <div class="bar"><button class="btn" id="more" hidden>Show more</button></div>
</section>

<p class="foot">Exercise data &amp; media from <a href="https://github.com/hasaneyldrm/exercises-dataset">hasaneyldrm/exercises-dataset</a>. Media © <a href="https://gymvisual.com/">Gym visual</a>. General fitness info only, not medical advice.</p>
</main>
<script>
const RAW='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const JSON_URL=RAW+'data/exercises.json';
const EQ={'Bodyweight':['body weight','weighted'],'Dumbbells':['dumbbell'],'Barbell':['barbell','ez barbell','olympic barbell','trap bar'],'Cables':['cable','rope'],'Machines':['leverage machine','smith machine','sled machine','assisted','stepmill machine','skierg machine','hammer'],'Bands':['band','resistance band'],'Kettlebell':['kettlebell'],'Other':['stability ball','medicine ball','bosu ball','roller','wheel roller','tire']};
const SPLITS={
 full:{Full:['pectorals','lats','quads','hamstrings|glutes','delts','abs']},
 push:{Push:['pectorals','pectorals','delts','triceps','triceps']},
 pull:{Pull:['lats','upper back','delts','biceps','biceps']},
 legs:{Legs:['quads','quads','hamstrings','glutes','calves','abs']},
 upper:{Upper:['pectorals','lats','upper back','delts','biceps','triceps']},
 lower:{Lower:['quads','hamstrings','glutes','calves','abs']},
 chest:{Chest:['pectorals','pectorals','pectorals','triceps']},
 back:{Back:['lats','lats','upper back','biceps','traps']},
 shoulders:{Shoulders:['delts','delts','delts','traps','abs']},
 arms:{Arms:['biceps','biceps','triceps','triceps','forearms']}
};
const WEEK={2:['full','full'],3:['push','pull','legs'],4:['upper','lower','upper','lower'],5:['chest','back','legs','shoulders','arms'],6:['push','pull','legs','push','pull','legs']};
const GOAL={str:{sets:[3,4,5],reps:'4-6',rest:'2-3 min'},hyp:{sets:[3,3,4],reps:'8-12',rest:'60-90 s'},end:{sets:[2,3,3],reps:'12-15',rest:'30-45 s'}};
const $=s=>document.querySelector(s);
let DATA=[],plan=null,cur=0;

$('#eq').innerHTML=Object.keys(EQ).map(k=>`<label><input type="checkbox" value="${k}" ${['Bodyweight','Dumbbells'].includes(k)?'checked':''}><span>${k}</span></label>`).join('');
const allowed=()=>new Set([...document.querySelectorAll('#eq input:checked')].flatMap(i=>EQ[i.value]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stepsFor(e){
  if(e.instruction_steps && Array.isArray(e.instruction_steps.en) && e.instruction_steps.en.length) return e.instruction_steps.en;
  if(e.instructions && e.instructions.en) return e.instructions.en.split(/(?<=[.!])\s+/).filter(Boolean);
  return [];
}

function pool(target,eq,used){
  const ts=target.split('|');
  return DATA.filter(e=>ts.includes(e.target)&&e.body_part!=='cardio'&&eq.has(e.equipment)&&!used.has(e.id));
}
function rx(slotIdx){
  const g=GOAL[$('#goal').value],l=+$('#lvl').value;
  return {sets:g.sets[l]-(slotIdx>=4?1:0)||2,reps:g.reps,rest:g.rest};
}
function generate(){
  const eq=allowed();
  if(!eq.size){alert('Pick at least one equipment type.');return}
  const keys=WEEK[$('#days').value],used=new Set();
  plan=keys.map((k,i)=>{
    const [name,slots]=Object.entries(SPLITS[k])[0];
    const lvl=+$('#lvl').value;
    const list=slots.slice(0,slots.length-(lvl===0?1:0));
    const ex=list.map((t,si)=>{
      const p=pool(t,eq,used);if(!p.length)return null;
      const e=pick(p);used.add(e.id);return {id:e.id,...rx(si),done:false};
    }).filter(Boolean);
    return {name:`Day ${i+1} · ${name}`,ex};
  });
  cur=0;save();render();
}
function render(){
  if(!plan){return}
  const box=$('#plan');
  box.innerHTML=`<div class="days">${plan.map((d,i)=>`<button class="${i===cur?'on':''}" data-d="${i}">${esc(d.name)}</button>`).join('')}</div><div id="day"></div>`;
  box.querySelectorAll('.days button').forEach(b=>b.onclick=()=>{cur=+b.dataset.d;render()});
  const day=plan[cur];
  $('#day').innerHTML=day.ex.map((x,i)=>{
    const e=DATA.find(d=>d.id===x.id);
    if(!e) return '';
    const steps=stepsFor(e);
    return `<div class="ex ${x.done?'done':''}"><img loading="lazy" src="${RAW+e.gif_url}" alt="${esc(e.name)}">
    <div><h3>${esc(e.name)}</h3><span class="tag">${esc(e.target)}</span><span class="tag">${esc(e.equipment)}</span>
    <div class="rx">${x.sets} sets × ${x.reps} reps · rest ${x.rest}</div>
    <details><summary>How to do it</summary><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('') || '<li>No instructions available.</li>'}</ol></details>
    <div class="acts"><label><input type="checkbox" data-i="${i}" class="chk" ${x.done?'checked':''}> Done</label><button class="btn" data-sw="${i}">Swap</button></div></div></div>`;
  }).join('')||'<div class="empty">No exercises match your equipment for this day.</div>';
  $('#day').querySelectorAll('.chk').forEach(c=>c.onchange=()=>{day.ex[c.dataset.i].done=c.checked;save();render()});
  $('#day').querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>swap(+b.dataset.sw));
}
function swap(i){
  const x=plan[cur].ex[i],old=DATA.find(d=>d.id===x.id),eq=allowed();
  const used=new Set(plan.flatMap(d=>d.ex.map(e=>e.id)));
  const p=DATA.filter(e=>e.target===old.target&&e.body_part!=='cardio'&&eq.has(e.equipment)&&!used.has(e.id));
  if(!p.length){alert('No other matching exercise for your equipment.');return}
  x.id=pick(p).id;x.done=false;save();render();
}
function save(){try{localStorage.setItem('gymplan',JSON.stringify(plan))}catch(e){}}
function load(){try{const s=localStorage.getItem('gymplan');if(s)plan=JSON.parse(s)}catch(e){}}

let libList=[],shown=0;
function libFilter(){
  const q=$('#q').value.toLowerCase(),b=$('#fb').value,e=$('#fq').value;
  libList=DATA.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.target.toLowerCase().includes(q))&&(!b||x.body_part===b)&&(!e||x.equipment===e));
  shown=0;$('#lib').innerHTML='';libMore();
}
function libMore(){
  const s=libList.slice(shown,shown+20);shown+=s.length;
  $('#lib').insertAdjacentHTML('beforeend',s.map(e=>{
    const steps=stepsFor(e);
    return `<div class="ex"><img loading="lazy" src="${RAW+e.gif_url}" alt="${esc(e.name)}"><div><h3>${esc(e.name)}</h3><span class="tag">${esc(e.body_part)}</span><span class="tag">${esc(e.target)}</span><span class="tag">${esc(e.equipment)}</span><details><summary>How to do it</summary><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('') || '<li>No instructions available.</li>'}</ol></details></div></div>`;
  }).join('')||'<div class="empty">No results.</div>');
  $('#more').hidden=shown>=libList.length;
}

function tab(n){
  $('#v1').hidden=n!==1;$('#v2').hidden=n!==2;
  $('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
$('#go').onclick=generate;$('#print').onclick=()=>print();
$('#q').oninput=libFilter;$('#fb').onchange=libFilter;$('#fq').onchange=libFilter;$('#more').onclick=libMore;

fetch(JSON_URL).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(d=>{
  DATA=d;
  const opt=(k)=>'<option value="">All</option>'+[...new Set(DATA.map(e=>e[k]))].sort().map(v=>`<option>${v}</option>`).join('');
  $('#fb').innerHTML=opt('body_part');$('#fq').innerHTML=opt('equipment');
  load();render();libFilter();
  if(!plan) $('#plan').innerHTML='<div class="empty">Choose your options and hit “Generate plan”.</div>';
}).catch(err=>{$('#plan').innerHTML=`<div class="empty">Could not load exercise data (${esc(err.message)}). Check your internet connection or try again.</div>`});
</script>
</body>
</html>
